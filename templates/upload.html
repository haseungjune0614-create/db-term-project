{% extends "base.html" %}
{% block title %}새 게시물 만들기 • Instagram{% endblock %}
{% block head %}
<style>
  .upload-wrap {
    max-width: 540px;
    margin: 48px auto;
    padding: 0 16px;
  }
  .modal-card {
    background: var(--elevated);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }
  .modal-header {
    text-align: center;
    padding: 12px 16px;
    font-size: 16px;
    font-weight: 600;
    border-bottom: 1px solid var(--border);
  }
  .modal-body {
    padding: 24px;
  }
  .drop-zone {
    border: 1px dashed var(--input-border);
    border-radius: 8px;
    background: var(--surface);
    min-height: 240px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 20px;
    margin-bottom: 18px;
    text-align: center;
  }
  .preview-img {
    display: none;
    max-width: 100%;
    max-height: 320px;
    border-radius: 6px;
    object-fit: contain;
  }
  .file-label {
    display: inline-block;
    padding: 8px 16px;
    background: var(--accent);
    color: #fff;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .file-input { display: none; }
  .caption-area {
    width: 100%;
    min-height: 96px;
    padding: 12px;
    background: var(--surface);
    border: 1px solid var(--input-border);
    border-radius: 8px;
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    resize: vertical;
    outline: none;
    margin-bottom: 16px;
  }
  .caption-area::placeholder { color: var(--faint); }
  .btn-share {
    width: 100%;
    padding: 11px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .error { color: var(--danger); font-size: 13px; margin-bottom: 14px; text-align: center; }
</style>
{% endblock %}
{% block content %}
<div class="upload-wrap">
  <div class="modal-card">
    <div class="modal-header">새 게시물 만들기</div>
    <div class="modal-body">
      {% if error %}
        <div class="error">{{ error }}</div>
      {% endif %}
      <form method="post" action="/upload" enctype="multipart/form-data">
        <div class="drop-zone">
          <img id="preview" class="preview-img" alt="미리보기">
          <div id="placeholder-icon">
            <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#a8a8a8" stroke-width="1.3">
              <rect x="3" y="3" width="18" height="18" rx="3"></rect>
              <circle cx="8.5" cy="8.5" r="1.6"></circle>
              <path d="M21 15l-5-5L5 21"></path>
            </svg>
            <div style="font-size:15px; color:var(--muted); margin-top:8px;">사진을 여기에 선택하세요</div>
          </div>
          <label class="file-label" for="image-input">컴퓨터에서 선택</label>
          <input id="image-input" class="file-input" type="file" name="image" accept="image/*" required
                 onchange="if(this.files && this.files[0]){ const img=document.getElementById('preview'); img.src=URL.createObjectURL(this.files[0]); img.style.display='block'; document.getElementById('placeholder-icon').style.display='none'; }">
        </div>

        <textarea class="caption-area" name="caption" maxlength="2200" placeholder="문구를 입력하세요..."></textarea>
        <button class="btn-share" type="submit">공유하기</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
