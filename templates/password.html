{% extends "base.html" %}
{% block title %}비밀번호 변경 • Instagram{% endblock %}
{% block head %}
<style>
  .pw-wrap {
    max-width: 440px;
    margin: 56px auto;
    padding: 0 16px;
  }
  .pw-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 28px;
  }
  .pw-card h2 {
    margin: 0 0 20px;
    font-size: 18px;
  }
  .field { margin-bottom: 14px; }
  .field label {
    display: block;
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .field input {
    width: 100%;
    padding: 11px 12px;
    background: var(--bg);
    border: 1px solid var(--input-border);
    border-radius: 6px;
    color: var(--text);
    font-size: 14px;
    outline: none;
  }
  .field input:focus { border-color: var(--muted); }
  .btn-submit {
    width: 100%;
    margin-top: 6px;
    padding: 10px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .error { color: var(--danger); font-size: 13px; margin-bottom: 14px; }
  .msg { color: var(--link-blue); font-size: 13px; font-weight: 600; margin-bottom: 14px; }
  .back-link {
    display: block;
    text-align: center;
    margin-top: 16px;
    font-size: 13px;
    color: var(--muted);
  }
  .back-link:hover { color: var(--text); }
</style>
{% endblock %}
{% block content %}
<div class="pw-wrap">
  <div class="pw-card">
    <h2>비밀번호 변경</h2>
    {% if error %}
      <div class="error">{{ error }}</div>
    {% endif %}
    {% if message %}
      <div class="msg">{{ message }}</div>
    {% endif %}
    <form method="post" action="/password">
      <div class="field">
        <label>현재 비밀번호</label>
        <input type="password" name="current_password" required>
      </div>
      <div class="field">
        <label>새 비밀번호</label>
        <input type="password" name="new_password" required>
      </div>
      <button class="btn-submit" type="submit">비밀번호 변경</button>
    </form>
    <a class="back-link" href="/profile/{{ me }}">프로필로 돌아가기</a>
  </div>
</div>
{% endblock %}
